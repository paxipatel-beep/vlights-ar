# =============================================================================
#  vlights AR Dashboard — Nginx Configuration
#  Domain: payments.paxipatelbot.in
#  This file is deployed automatically by deploy.sh
#  Manual path: /etc/nginx/sites-available/payments.paxipatelbot.in
# =============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name payments.paxipatelbot.in;

    # Certbot will automatically add an HTTPS redirect block here.
    # If you're setting up manually, uncomment the next block and comment out
    # the location {} below, then run certbot separately.

    location / {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host       $host;
        proxy_set_header X-Real-IP  $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_cache_bypass      $http_upgrade;
        proxy_read_timeout      300s;
        proxy_connect_timeout   75s;

        # Allow large file uploads (Excel/CSV bulk upload)
        client_max_body_size    20M;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_min_length 1000;
}

